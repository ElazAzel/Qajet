# Переносимость (agents.md фаза 8, ADR-0002) — полный стек для запуска
# на собственных серверах вместо Vercel: приложение (Dockerfile рядом,
# `output: 'standalone'`), собственный Postgres, S3-совместимое хранилище.
#
# Честно про границу этого файла: он поднимает ДАННЫЕ (Postgres) и
# ФАЙЛОВОЕ ХРАНИЛИЩЕ (MinIO) — не полный self-host Supabase (Auth,
# PostgREST, Realtime). apps/web говорит с Supabase только через
# `@supabase/ssr`/`@supabase/supabase-js` по HTTP (`NEXT_PUBLIC_SUPABASE_URL`),
# а не напрямую в Postgres — так что `web` ниже по-прежнему указывает на
# такой Auth/REST-слой отдельной переменной, а не поднимает его сам.
# Три реальных варианта на выбор при переезде:
#   1. Оставить Supabase Cloud только для Auth/PostgREST, данные —
#      физически в этом Postgres (репликация/перенос — see
#      docs/runbook-migration.md);
#   2. Поднять официальный self-hosted Supabase рядом
#      (github.com/supabase/supabase/tree/master/docker) поверх ЭТОГО ЖЕ
#      Postgres — тогда `postgres` ниже не нужен отдельно, один инстанс;
#   3. Написать собственный auth/REST-шлюз — не рассматривается, Supabase
#      уже решает эту задачу, реализовывать заново незачем (agents.md §2).
# `docs/runbook-migration.md` — пошагово, какой из трёх путей когда выбрать.
#
# MinIO подключен и готов (S3 API), но НИ ОДИН путь кода в apps/web пока
# его не вызывает — в проекте нет ни одной функции загрузки файлов
# (вложения к КП, фото и т.п. — см. apps/mobile/README.md, «камера
# заложена в план, но никуда не подключена»). Он здесь по чек-листу фазы 8
# плана («S3-совместимое хранилище»), не потому что уже используется.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qajet}
      POSTGRES_USER: ${POSTGRES_USER:-qajet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qajet} -d ${POSTGRES_DB:-qajet}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qajet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # веб-консоль
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Создаёт бакет один раз при первом поднятии стека и завершается —
  # не отдельный демон, `restart: "no"` намеренно.
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/qajet-files
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qajet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # Auth/PostgREST — Supabase Cloud или self-hosted, см. комментарий
      # вверху файла. `postgres` ниже становится реальным хранилищем данных
      # приложения только после переноса схемы/данных туда — сама по себе
      # эта переменная ничего не переключает, апп продолжает читать
      # оттуда, куда указывает NEXT_PUBLIC_SUPABASE_URL.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?задайте адрес Supabase Auth/REST в .env}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?задайте anon-ключ в .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-qajet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qajet}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FEATURE_LLM_ASSIST: 'false'

volumes:
  postgres_data:
  minio_data:
