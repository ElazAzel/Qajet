name: Release gate

# Только вручную — по той же причине, что и CI (см. ci.yml): автоматический
# запуск на каждое слияние в main тратит платные минуты GitHub. Проверить
# готовность выкладки можно и без GitHub:
#
#     pnpm release:check:strict -- --ready-url=https://qajet-seven.vercel.app
on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Проверить evidence, обязательную конфигурацию и точный SHA runtime'
        type: boolean
        default: false
      evidence_json:
        description: 'Release evidence JSON с sourceSha/gateSourceShas для выпускаемого commit (strict)'
        type: string
        default: ''
      ready_url:
        description: 'Адрес развёртывания для проверки /api/ready (нужен при strict)'
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--no-warnings'

jobs:
  release-gate:
    name: Release source and runtime gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Каждый push в main проверяет исходники. Строгий режим — про развёртывание:
      # он запускается вручную и падает, если в окружении нет обязательных
      # переменных, evidence для целевого SHA или безопасного JSON /api/ready. Раньше «готовность»
      # подтверждалась записью в readiness.json, пока /api/ready в production
      # отдавал 503.
      - name: Source readiness (non-strict)
        if: ${{ !inputs.strict }}
        run: pnpm release:check

      - name: Deployment readiness (strict)
        if: ${{ inputs.strict }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const evidence = JSON.parse(process.env.RELEASE_EVIDENCE_JSON || 'null');
          writeFileSync(join(process.env.RUNNER_TEMP, 'qajet-release-evidence.json'), JSON.stringify(evidence));
          NODE
          node tools/ci/check-release-readiness.mjs --strict --ready-url="$READY_URL" --evidence="$RUNNER_TEMP/qajet-release-evidence.json"
        env:
          # Через переменную, а не подстановкой в команду: вход workflow_dispatch не должен попадать в shell.
          READY_URL: ${{ inputs.ready_url }}
          RELEASE_EVIDENCE_JSON: ${{ inputs.evidence_json }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINK_SIGNING_SECRET: ${{ secrets.LINK_SIGNING_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @qajet/web build
      - name: RAG freshness
        run: pnpm rag:sync
      - name: Generated state is committed
        shell: bash
        run: |
          if ! git diff --quiet -- docs/state; then
            echo 'docs/state is stale; run pnpm rag:sync and commit the result.'
            git diff --stat -- docs/state
            exit 1
          fi
