name: CI

# Один прогон на одно изменение. Раньше стояли голые `push` и `pull_request`,
# и каждый пуш в ветку с открытым PR запускал весь набор ДВАЖДЫ: у события push
# ref — refs/heads/<ветка>, у pull_request — refs/pull/<n>/merge, группы
# concurrency разные, и ни один из прогонов не отменял другой. Минуты GitHub
# платные сверх бесплатных 2 000 в месяц, а каждая задача округляется вверх до
# целой минуты, так что дубль стоил полного второго прогона.
#
# Теперь ветки проверяются через pull_request, а main — через push после слияния.
# Ветка без PR проверяется вручную (workflow_dispatch) или локально: pnpm ci:local.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # node:sqlite (tools/rag) — экспериментальный API, предупреждение не
  # должно шуметь в логах CI, но и не должно требовать флага для запуска.
  NODE_OPTIONS: '--no-warnings'

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: Typecheck (Turborepo)
        run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Тесты с реальной базой здесь пропускаются (нет DATABASE_URL) — их
      # запускает отдельный job rls-isolation, который падает без базы.
      - run: pnpm test

  build:
    name: Build apps/web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qajet/web build

  # Сквозные сценарии ведут реальные экраны трёх ролей до закрытия заказа.
  # Раньше job ждал секретов репозитория и без них пропускал все шаги, оставаясь
  # зелёным: в отчёте «e2e прошёл» не означало, что e2e запускался. Теперь job
  # поднимает собственную локальную Supabase (Postgres + Auth + REST + Storage),
  # применяет миграции, заливает демо-данные и гоняет весь набор Playwright.
  # Секреты не нужны, боевой проект недостижим.
  e2e:
    name: Сквозные сценарии (Playwright, локальная Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Версия закреплена: `latest` менял бы поведение CI независимо от репозитория.
          # 2.117.0 — последний стабильный релиз на 2026-09-20; обновлять осознанно, прогнав
          # миграции и RLS-набор на новой версии.
          version: 2.117.0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: supabase start
        run: >
          supabase start
          --exclude realtime,imgproxy,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Окружение из supabase status
        run: node tools/dev/local-supabase-env.mjs --github-env

      - name: Миграции и демо-данные
        run: |
          pnpm --filter @qajet/db db:migrate
          pnpm --filter @qajet/db db:reset

      - name: Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm --filter @qajet/web build

      - name: Playwright (все сценарии)
        working-directory: apps/web
        run: pnpm exec playwright test
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # Без отчёта и трасс падение в CI нечем разбирать: раньше
      # `trace: retain-on-failure` писал их в каталог, который никуда не уходил.
      - name: Отчёт и трассы Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  public-e2e:
    name: Публичные сценарии (Playwright, без базы)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm --filter @qajet/web build

      # Лендинг и страница StartupBattle не обращаются к базе. Раньше сюда
      # входил один файл, а остальные девять сценариев без секретов не
      # запускались вовсе.
      - name: Public smoke и StartupBattle
        working-directory: apps/web
        run: pnpm exec playwright test e2e/public-smoke.spec.ts e2e/startupbattle.spec.ts

  rls-isolation:
    name: Тесты с реальным PostgreSQL (RLS, права, целостность)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Версия закреплена: `latest` менял бы поведение CI независимо от репозитория.
          # 2.117.0 — последний стабильный релиз на 2026-09-20; обновлять осознанно, прогнав
          # миграции и RLS-набор на новой версии.
          version: 2.117.0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Postgres, Auth и Storage: тесты вложений читают storage.objects, а
      # роли authenticated/anon/service_role и auth.uid() идут из образа
      # supabase/postgres.
      - name: supabase start
        run: >
          supabase start
          --exclude realtime,imgproxy,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Применить миграции packages/db
        run: pnpm --filter @qajet/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # test:rls теперь падает без DATABASE_URL, а не пропускает тесты молча.
      - name: Изоляция арендаторов, защита записи, права на функции
        run: pnpm --filter @qajet/db test:rls
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: PD_BACKEND=postgres против реального RLS (ADR-0005)
        run: pnpm --filter @qajet/pd test:rls
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  rag-freshness:
    name: RAG-индекс не отстал от кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm rag:sync (генерирует docs/state/ и индекс)
        run: pnpm rag:sync

      - name: docs/state/ не разошлось с рабочим деревом
        run: |
          if ! git diff --quiet -- docs/state; then
            echo "::error::docs/state/ устарел — запустите 'pnpm rag:sync' и закоммитьте результат."
            git diff --stat -- docs/state
            exit 1
          fi

  # Итог по каждому job в трёх исходах. Зелёная галочка GitHub не отличает
  # «проверка выполнена» от «проверку пропустили»; здесь пропуск — NOT RUN.
  gates:
    name: Итог ворот (PASS / FAIL / NOT RUN)
    if: always()
    needs: [lint-and-typecheck, test, build, e2e, public-e2e, rls-isolation, rag-freshness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Здесь нужен только node: pnpm не ставится, а setup-node@v5 иначе включает
          # кеш pnpm по полю packageManager и падает.
          package-manager-cache: false

      - name: Сводка
        run: node tools/ci/summarize-gates.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

      - name: gates.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates
          path: gates.json
          retention-days: 90
