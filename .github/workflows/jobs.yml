name: Scheduled jobs

# Расписание отсюда УБРАНО: фоновые задачи теперь запускает сама база через
# pg_cron — миграция 0057_scheduled_jobs_in_database.sql.
#
# Почему. Запуск каждые 15 минут — это 96 раз в сутки. Каждый длился около
# 7 секунд, но GitHub округляет каждую задачу до целой минуты: выходило около
# 2 880 оплачиваемых минут в месяц при бесплатных 2 000. Одно это расписание
# исчерпывало лимит, после чего GitHub блокировал и его, и CI. Очередь
# уведомлений при этом не разбиралась вовсе — RFQ не доходили до поставщиков.
# Vercel Cron не подходит тоже: на тарифе Hobby он запускается не чаще раза в
# сутки. pg_cron работает внутри базы и поминутно не тарифицируется.
#
# Ручной запуск оставлен: он удобен, чтобы проверить задачи сразу после
# выкладки, не дожидаясь очередного срабатывания в базе.
on:
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    name: Разобрать очереди
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: outbox и learning
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://qajet-seven.vercel.app' }}
        shell: bash
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET не задан в секретах репозитория"
            exit 1
          fi
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          # Пока приложение не готово (нет ключей окружения), задачи не имеют смысла.
          # Это NOT RUN, а не успех: причина видна в сообщении, а готовность
          # проверяет release-gate.
          if ! ready=$(curl -sS --connect-timeout 10 --max-time 45 -o "$tmp_dir/ready.json" -w '%{http_code}' "$APP_URL/api/ready"); then
            ready=000
          fi
          if [ "$ready" != "200" ]; then
            echo "::warning::NOT RUN: $APP_URL/api/ready вернул $ready, очереди не разбирались"
            exit 1
          fi
          failed=0
          for job in outbox learning; do
            if ! code=$(curl -sS --connect-timeout 10 --max-time 45 -o "$tmp_dir/$job.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/jobs/$job"); then
              code=000
            fi
            echo "$job: HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::задача $job завершилась с HTTP $code"
              failed=1
              continue
            fi
            # Не повторяем batch: успешные элементы могли уже зафиксироваться.
            # Не печатаем сырой ответ, в том числе при ошибке разбора JSON.
            if ! jq -se 'length == 1 and (.[0] | type == "object" and .ok == true and (.failed | type == "number" and . == 0) and (if has("retryUnconfirmed") then (.retryUnconfirmed | type == "number" and . == 0) else true end))' "$tmp_dir/$job.json" >/dev/null 2>&1; then
              echo "::error::задача $job вернула отказ или некорректный результат batch"
              failed=1
            fi
          done
          exit "$failed"
